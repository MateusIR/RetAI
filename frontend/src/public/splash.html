<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Iniciando RetAI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a; /* Cor slate-900 para combinar com seu dark mode */
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #14b8a6; /* Cor teal-500 (sua accent) */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
    .subtitle { font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">RetAI</div>
  <div class="subtitle">Inicializando Motor de IA e Servidor...</div>
</body>
</html>
